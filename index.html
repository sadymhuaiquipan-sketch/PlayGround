<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><title>Block World</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79b7df;font-family:"Trebuchet MS",Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}
#crosshair{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none}#crosshair:before,#crosshair:after{content:"";position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 1px #000}#crosshair:before{left:8px;top:0;width:2px;height:18px}#crosshair:after{left:0;top:8px;width:18px;height:2px}
#hotbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;background:rgba(20,20,20,.55);border:3px solid rgba(20,20,20,.7)}
.slot{width:52px;height:52px;border:3px solid #777;position:relative;background:rgba(0,0,0,.25);image-rendering:pixelated}.slot.selected{border-color:white;transform:translateY(-3px)}.blockicon{position:absolute;width:32px;height:32px;left:7px;top:8px;box-shadow:inset -6px -6px rgba(0,0,0,.18),inset 5px 5px rgba(255,255,255,.18);border:1px solid rgba(0,0,0,.25)}.count{position:absolute;right:3px;bottom:1px;color:white;font-size:13px;text-shadow:1px 1px 2px #000}
#top{position:absolute;left:16px;top:14px;color:white;text-shadow:2px 2px 2px #000;font-weight:bold;font-size:14px}#status{position:absolute;right:16px;top:14px;color:white;text-shadow:1px 1px 2px #000;font-size:13px}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(83,151,207,.35),rgba(12,54,29,.55));z-index:5}.panel{text-align:center;color:white;text-shadow:3px 3px #333}.logo{font-size:62px;font-weight:bold;letter-spacing:-4px;margin-bottom:10px;color:#ddd;-webkit-text-stroke:2px #555}.logo span{color:#8fce55}.panel button{font-family:inherit;font-weight:bold;font-size:18px;padding:14px 34px;border:3px solid #999;border-bottom:5px solid #555;background:#72b94c;color:white;text-shadow:2px 2px #3d7029;cursor:pointer}.panel p{font-size:13px;margin:16px 0 0}
#joystick{display:none;position:absolute;left:24px;bottom:30px;width:110px;height:110px;border-radius:50%;background:rgba(0,0,0,.22);border:2px solid rgba(255,255,255,.35);z-index:3}#stick{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid rgba(0,0,0,.25)}#actions{display:none;position:absolute;right:18px;bottom:28px;z-index:3}.action{width:58px;height:58px;border-radius:50%;margin:8px 0;background:rgba(0,0,0,.38);border:2px solid rgba(255,255,255,.55);color:white;font-weight:bold;font-size:22px}
@media(pointer:coarse),(max-width:800px){#hotbar{bottom:8px}.slot{width:42px;height:42px}.blockicon{width:24px;height:24px}.slot{border-width:2px}#joystick,#actions{display:block}.panel p{padding:0 20px}}
</style>
</head>
<body>
<div id="top">SURVIVAL</div><div id="status">Day 1 · Plains</div><div id="crosshair"></div>
<div id="hotbar"></div>
<div id="joystick"><div id="stick"></div></div><div id="actions"><button class="action" id="jump">↑</button><br><button class="action" id="mine">⛏</button></div>
<div id="start"><div class="panel"><div class="logo">BLOCK<span>WORLD</span></div><button id="play">PLAY</button><p>WASD move · Mouse look · Click mine · Right click place · 1–6 select</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x78b5df);scene.fog=new THREE.Fog(0x78b5df,26,62);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,120);camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const hemi=new THREE.HemisphereLight(0xcfeaff,0x55733a,2);scene.add(hemi);const sun=new THREE.DirectionalLight(0xfff2c2,2.2);sun.position.set(-18,28,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=sun.shadow.camera.bottom=-30;sun.shadow.camera.right=sun.shadow.camera.top=30;scene.add(sun);
const texCache={};function canvasTex(base,dark,noise=18){const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,16,16);for(let i=0;i<noise;i++){x.fillStyle=(Math.random()>.5?dark:'rgba(255,255,255,.12)');const s=1+Math.floor(Math.random()*3);x.fillRect(Math.floor(Math.random()*16),Math.floor(Math.random()*16),s,s)}const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;return t}
const mats={grass:[canvasTex('#62a744','#367126'),canvasTex('#62a744','#367126'),canvasTex('#795a38','#4f3924'),canvasTex('#795a38','#4f3924')],dirt:canvasTex('#795a38','#503821'),stone:canvasTex('#858580','#60605c'),wood:[canvasTex('#9a703e','#604421'),canvasTex('#9a703e','#604421'),canvasTex('#c09a5a','#7a5931'),canvasTex('#c09a5a','#7a5931')],leaves:canvasTex('#397d31','#225d22'),sand:canvasTex('#dbcc91','#bbaa70'),brick:canvasTex('#a95a45','#733629')};
const cubeGeo=new THREE.BoxGeometry(1,1,1);const world=new Map();function key(x,y,z){return `${x},${y},${z}`}function addBlock(x,y,z,type,skip=false){const k=key(x,y,z);if(world.has(k)&&!skip)return;world.set(k,{type,mesh:null});let material=mats[type];if(type==='grass'&&Array.isArray(material)){const box=new THREE.MeshStandardMaterial({map:material[0]});const side=new THREE.MeshStandardMaterial({map:material[2]});const top=new THREE.MeshStandardMaterial({map:canvasTex('#62a744','#367126',30)});material=[side,side,top,side,side,side]}else if(Array.isArray(material)){const b=material.map(v=>new THREE.MeshStandardMaterial({map:v}));material=b}else material=new THREE.MeshStandardMaterial({map:material});const m=new THREE.Mesh(cubeGeo,material);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;m.userData={x,y,z,type};scene.add(m);world.get(k).mesh=m}
function noise(x,z){return Math.sin(x*.31)*.7+Math.cos(z*.27)*.65+Math.sin((x+z)*.17)*.5}
for(let x=-17;x<=17;x++)for(let z=-17;z<=17;z++){const h=Math.floor(noise(x,z)+2);for(let y=-2;y<h;y++){let type=y<h-2?'stone':'dirt';if(h<=0&&y===h-1)type='sand';if(y===h-1)type=(h<=0?'sand':'grass');addBlock(x,y,z,type)}
 if(Math.random()<.025&&h>1)addTree(x,h,z)}
function addTree(x,y,z){for(let i=1;i<=4;i++)addBlock(x,y+i,z,'wood');for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=3;dy<=5;dy++)if(Math.abs(dx)+Math.abs(dz)+Math.abs(dy-4)<5&&!(dx===0&&dz===0&&dy<5))addBlock(x+dx,y+dy,z+dz,'leaves')}
// Water and a few ponds
for(let x=-16;x<=16;x++)for(let z=-16;z<=16;z++)if(noise(x,z)+2<1.1)addBlock(x,-1,z,'sand');
const waterMat=new THREE.MeshStandardMaterial({color:0x3f91c8,transparent:true,opacity:.72,roughness:.15});const water=new THREE.Mesh(new THREE.PlaneGeometry(34,34),waterMat);water.rotation.x=-Math.PI/2;water.position.set(0,-.25,0);scene.add(water);
const clouds=[];const cloudMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.82});for(let i=0;i<12;i++){const g=new THREE.Group();for(let j=0;j<5;j++){const c=new THREE.Mesh(new THREE.BoxGeometry(2.5+Math.random()*2,1,1.8+Math.random()),cloudMat);c.position.set(j*2,Math.random()*.5,j*.2);g.add(c)}g.position.set((Math.random()-5)*9,14+Math.random()*4,(Math.random()-5)*9);scene.add(g);clouds.push(g)}
camera.position.set(0,5,10);let yaw=0,pitch=-.12,vy=0,onGround=false,keys={},touchMove={x:0,y:0};const player={height:1.7,radius:.32};
const types=['grass','dirt','stone','wood','leaves','brick'];const hotbar=document.querySelector('#hotbar');const colors={grass:'#62a744',dirt:'#795a38',stone:'#858580',wood:'#9a703e',leaves:'#397d31',brick:'#a95a45'};types.forEach((t,i)=>{const s=document.createElement('div');s.className='slot'+(i===0?' selected':'');s.dataset.i=i;s.innerHTML=`<div class="blockicon" style="background:${colors[t]}"></div><div class="count">64</div>`;hotbar.appendChild(s)});let selected=0;
function select(i){selected=(i+types.length)%types.length;document.querySelectorAll('.slot').forEach((s,n)=>s.classList.toggle('selected',n===selected));}
document.querySelectorAll('.slot').forEach(s=>s.onclick=()=>select(+s.dataset.i));
addEventListener('keydown',e=>{keys[e.code]=true;if(/^Digit[1-6]$/.test(e.code))select(+e.code.slice(-1)-1);if(e.code==='Space')keys.Space=true});addEventListener('keyup',e=>keys[e.code]=false);
let pointerLocked=false;addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0024;pitch-=e.movementY*.0024;pitch=Math.max(-1.5,Math.min(1.5,pitch))}});renderer.domElement.addEventListener('click',()=>{if(matchMedia('(pointer:fine)').matches&&document.getElementById('start').style.display==='none')renderer.domElement.requestPointerLock()});
const ray=new THREE.Raycaster();ray.far=6;function targetBlock(place){ray.setFromCamera(new THREE.Vector2(0,0),camera);const hits=ray.intersectObjects([...world.values()].map(v=>v.mesh));if(!hits.length)return;const hit=hits[0].object;const p=hit.position;if(place){const n=hits[0].face.normal;addBlock(p.x+n.x,p.y+n.y,p.z+n.z,types[selected])}else{const k=key(p.x,p.y,p.z);const b=world.get(k);if(b){scene.remove(b.mesh);world.delete(k)}}}
renderer.domElement.addEventListener('mousedown',e=>{if(e.button===0)targetBlock(false);if(e.button===2)targetBlock(true)});addEventListener('contextmenu',e=>e.preventedDefault&&e.preventDefault());
document.getElementById('play').onclick=e=>{document.getElementById('start').style.display='none';if(matchMedia('(pointer:fine)').matches)renderer.domElement.requestPointerLock()};
function solid(x,y,z){if(y<-3||y>30)return true;return world.has(key(Math.round(x),Math.round(y),Math.round(z)))}
function collides(pos){for(let x=-1;x<=1;x++)for(let z=-1;z<=1;z++)for(let y=0;y<=1;y++){if(solid(pos.x+x*.32,pos.y-player.height+y,pos.z+z*.32))return true}return false}
function jump(){if(onGround){vy=8;onGround=false}}
function animate(){requestAnimationFrame(animate);const dt=Math.min(.033,(performance.now()-animate.last)/1000||.016);animate.last=performance.now();let dx=0,dz=0;if(keys.KeyW)dz-=1;if(keys.KeyS)dz+=1;if(keys.KeyA)dx-=1;if(keys.KeyD)dx+=1;if(touchMove.x||touchMove.y){dx=touchMove.x;dz=touchMove.y}if(dx||dz){const len=Math.hypot(dx,dz);dx/=len;dz/=len;const sin=Math.sin(yaw),cos=Math.cos(yaw);const mx=(dx*cos-dz*sin)*4.5*dt,mz=(dx*sin+dz*cos)*4.5*dt;const nx=camera.position.clone();nx.x+=mx;if(!collides(nx))camera.position.x=nx.x;nx.copy(camera.position);nx.z+=mz;if(!collides(nx))camera.position.z=nx.z}if(keys.Space)jump();vy-=18*dt;const np=camera.position.clone();np.y+=vy*dt;if(!collides(np)){camera.position.y=np.y;onGround=false}else{if(vy<0)onGround=true;vy=0}camera.position.y=Math.max(camera.position.y,1);camera.rotation.set(pitch,yaw,0);clouds.forEach(c=>c.position.x+=dt*.35);renderer.render(scene,camera)}animate.last=performance.now();animate();
const joy=document.getElementById('joystick'),stick=document.getElementById('stick');joy.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});joy.addEventListener('touchmove',e=>{e.preventEvent&&e.preventEvent();const r=joy.getBoundingClientRect(),t=e.touches[0],dx=t.clientX-(r.left+55),dy=t.clientY-(r.top+55),len=Math.hypot(dx,dy),scale=Math.min(40,len);if(len){touchMove.x=dx/len;touchMove.y=-dy/len}else{touchMove.x=touchMove.y=0}stick.style.transform=`translate(${dx/len*scale||0}px,${dy/len*scale||0}px)`},{passive:false});joy.addEventListener('touchend',()=>{touchMove={x:0,y:0};stick.style.transform=''});document.getElementById('jump').addEventListener('touchstart',e=>{e.preventDefault();jump()},{passive:false});document.getElementById('mine').addEventListener('touchstart',e=>{e.preventDefault();targetBlock(false)},{passive:false});
// Mobile look by swiping on the right side
let lx=null,ly=null;renderer.domElement.addEventListener('touchstart',e=>{if(e.touches.length){lx=e.touches[0].clientX;ly=e.touches[0].clientY}},{passive:true});renderer.domElement.addEventListener('touchmove',e=>{if(lx!==null&&e.touches.length){const t=e.touches[0];yaw-= (t.clientX-lx)*.004;pitch-= (t.clientY-ly)*.004;pitch=Math.max(-1.5,Math.min(1.5,pitch));lx=t.clientX;ly=t.clientY}},{passive:true});
</script>
</body>
</html>
